[server]
host = "127.0.0.1"
port = 3000
body_limit_kb = 32

[database]
path = "./data/database.sqlite"

[openai]
# Copie este arquivo para config.toml e preencha a chave somente na cópia local.
# Nunca envie a chave para o Git, frontend, logs ou mensagens.
api_key = ""
text_model = "gpt-6-luna"
image_model = "gpt-image-2.5-flare"
reasoning_effort = "low"
image_quality = "low"
timeout_seconds = 120
max_retries = 1
max_output_tokens = 8000

[images]
directory = "./data/images"
public_path = "/generated-images"
size = "1536x1024"
format = "webp"
compression = 85
fallback_enabled = true

[generation]
provider = "mock"
suspect_count = 3
document_count = 4
image_count = 1 # cena principal; os retratos usam uma prancha adicional
max_case_generations_per_hour = 5
max_concurrent_generations = 1
